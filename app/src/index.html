<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniQlock</title>
    <!-- Use Google Fonts (Inter) as agreed in the plan -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- Main Widget Container -->
    <main id="widget-container" class="hidden">
      <!-- Video Background -->
      <video id="bg-video" loop muted playsinline>
        <!-- Source will be set via JS -->
      </video>

      <!-- Audio BGM -->
      <audio id="bg-audio" loop>
        <!-- Source will be set via JS -->
      </audio>

      <!-- Overlay (Clock) -->
      <div id="viewContainer" class="overlay" data-tauri-drag-region>
        <div id="time1" class="time-layer">
          <div class="time">00:00:00</div>
        </div>
        <div id="time2" class="time-layer">
          <div class="time">00:00:00</div>
        </div>
      </div>
    </main>

    <!-- Download Prompt Overlay -->
    <div id="download-prompt" class="hidden">
      <div class="prompt-box">
        <h2>Download Required</h2>
        <p>1.3GB of media files are required to run UniQlock.</p>
        <p>Do you want to download and install them now?</p>
        <p id="download-status"></p>
        <div class="prompt-buttons">
          <button id="btn-download-yes">Yes</button>
          <button id="btn-download-no">No</button>
        </div>
      </div>
    </div>

    <script type="module" src="/main.js" defer></script>
  </body>
</html>
