<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniQlock</title>
    <!-- Use Google Fonts (Inter) as agreed in the plan -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  </head>

  <body>
    <!-- Main Widget Container -->
    <main id="widget-container" class="hidden">
      <!-- Video Background -->
      <video id="bg-video" loop muted playsinline>
        <!-- Source will be set via JS -->
      </video>

      <!-- Audio BGM -->
      <audio id="bg-audio" loop>
        <!-- Source will be set via JS -->
      </audio>

      <!-- Overlay (Clock & Settings) -->
      <div class="overlay" data-tauri-drag-region>
        <div id="clock-display">00:00:00</div>
        
        <!-- Controls / Settings Button -->
        <div class="controls" data-tauri-drag-region>
          <button id="mute-btn" title="Mute/Unmute">
            <svg id="icon-unmuted" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
            <svg id="icon-muted" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
          </button>
        </div>
      </div>
    </main>

    <!-- Download Prompt Overlay -->
    <div id="download-prompt" class="hidden">
      <div class="prompt-box">
        <h2>Download Required</h2>
        <p>1.3GB of media files are required to run UniQlock.</p>
        <p>Do you want to download and install them now?</p>
        <p id="download-status"></p>
        <div class="prompt-buttons">
          <button id="btn-download-yes">Yes</button>
          <button id="btn-download-no">No</button>
        </div>
      </div>
    </div>

    <script type="module" src="/main.js" defer></script>
  </body>
</html>
